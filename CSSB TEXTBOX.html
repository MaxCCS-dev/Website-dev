<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-container {
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            width: 200px;
            background-color: rgb(253, 229, 204);
            padding: 20px;
        }

        .flex-container div {
            width: 200px;
            background-color: rgb(229, 202, 175);
            margin: 5px;
            padding: 5px;
        }
    </style>

</head>

<body>
    <div class="flex-container">
        <div>bunny</div>
        <div>bear</div>
        <div>cat</div>
    </div>

</body>

</html>
