<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=2, initial-scale=1.0">
    <title>A Creepy story</title>
    <style>
body.Dark {
color:white;
background: black;
}

button{
display: block;
margin: 5px;

}

    </style>
</head>
<body>
    <h1>The Basement</h1>
    <p id="story">I wanted to find my friend, and he was hiding in the basment.</p>
    <Button onclick="goDark()">Get in the mood</Button>
    <Button onclick="finishTheStory()">Tell me what happened</Button>
<script>
function goDark(){
document.body.className = "Dark";
}
function finishTheStory(){
document.getElementById("story").innerHTML="So I carefully searched the damp dungeon. There you are!";


}





</script>







</body>
</html>
