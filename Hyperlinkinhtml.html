<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperlinks in html</title>
</head>
<body>
    <h1>Hyperlinks in html</h1>

    <a href="https://viliusle.github.io/miniPaint/#">miniPaint</a><br>
    <a href="https://en.akinator.com/">akinator</a>
<h1>tables in html</h1>

    <table border="5">
<tr>
<th>name</th>
<th>age</th>
<th>city</th>
</tr>
<tr>
<td>maki</td>
<td>12</td>
<td>tokyo</td>
</tr>

    </table>
    <h1>lists in html</h1>
    <h2>ordered lists</h2>
    <ol>
        <li>milk</li>
        <li>eggs</li>
        <li>flour</li>
        <li>sugar</li>
        <li>icecream</li>
    </ol>
    <h2>unordered lists</h2>
    <ul>
<li>milk</li>
<li>eggs</li>
<li>flour</li>
    </ul>
    <h2>description list</h2>
    <dl>
<dt>cake</dt>
<dd>sweet and yummy</dd>
<dt>cupcake</dt>
<dd>small and sweet</dd>
    </dl>
</body>
</html>
